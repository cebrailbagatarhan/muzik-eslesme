name: Matching explanation tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  matching:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx --test apps/api/test/engine.test.ts
      - run: npm run typecheck -w @ahenk/api
