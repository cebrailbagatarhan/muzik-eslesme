name: Taste Summary Checks

on:
  pull_request:
    paths:
      - 'apps/api/src/taste-summary.ts'
      - 'apps/api/src/core-routes.ts'
      - 'apps/api/test/taste-summary.test.ts'
      - '.github/workflows/taste-summary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taste-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Favorite decade unit tests
        run: node --import tsx --test apps/api/test/taste-summary.test.ts
      - name: API TypeScript check
        run: npm run typecheck -w @ahenk/api
