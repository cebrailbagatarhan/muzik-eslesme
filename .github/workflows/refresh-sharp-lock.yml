name: Refresh sharp lockfile

on:
  push:
    branches: [fix/second-audit]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/second-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install sharp@0.35.4 -w @ahenk/api --package-lock-only --ignore-scripts
      - name: Commit generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-sharp-lock.yml
          git add apps/api/package.json package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m "fix: upgrade sharp to 0.35.4"
          git push origin HEAD:fix/second-audit
